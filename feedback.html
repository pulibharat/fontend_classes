<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        form {
            width: 300px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 5px;
        }

        button {
            margin-top: 15px;
            padding: 6px 12px;
        }
    </style>
</head>
<body>

    <h2>Feedback Form</h2>

    <form>

        <label>Name</label>
        <input type="text" required>

        <label>Email</label>
        <input type="email" required>

        <label>Rating</label>
        <select>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>

        <label>Feedback</label>
        <textarea rows="4"></textarea>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
