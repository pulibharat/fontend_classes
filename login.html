<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
           
            margin-left: 200px;
            margin-right: 200px;
        }

        form {
            width: 300px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 5px;
        }

        button {
            margin-top: 15px;
            padding: 6px 12px;
        }
    </style>
</head>
<body>

    <h2>Login Form</h2>

    <form>
        <label>Username</label>
        <input type="text" required>

        <label>Password</label>
        <input type="password" required>

        <button type="submit">Login</button>
    </form>

</body>
</html>
